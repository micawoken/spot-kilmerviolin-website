name: Verify main branch is always pushed to from staging and never development
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  check-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch order
        run: |
          if [${{ github.base_ref }} = "main"] && [${{ github.head_ref }} != "staging"]; then
            echo "Branch sequence error: pull request to main must originate from staging; push to staging, then retry from staging"
            exit 1
          fi
          exit 0
