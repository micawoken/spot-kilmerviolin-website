name: Deploy Worker to Staging
on:
  push:
    branches:
      - staging
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Astro site
        run: npm run build
      
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          secrets: |
            CF_ACCESS_TOKEN
            CF_DEPLOY_HOOK
          preCommands: echo "Deploying to Cloudflare Workers staging..."
          postCommands: echo "Deployment complete."
        env: 
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
