name: Staging preview (release gate)
# Builds a non-live preview whenever a release into main is proposed. This is the required
# status check on main: the PR cannot merge until this job succeeds. Triggering on the PR (not
# on every push to staging) means a preview is built only when a release is actually proposed,
# and only rebuilt when the PR gains new commits.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

# One preview build per PR; cancel a superseded run when new commits arrive so redundant
# uploads do not stack up.
concurrency:
  group: staging-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  staging-preview:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        run: pnpm run build

      - name: Upload staging preview version to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          # Upload a non-live preview version under the "staging" alias, reachable at
          # staging-<worker>.<subdomain>.workers.dev without taking production traffic. No secrets
          # are set here: they are only used by the API, which is disabled on staging, and putting
          # secrets would create a live deployment.
          command: versions upload --preview-alias staging
          preCommands: echo "Uploading staging preview version..."
          postCommands: echo "Staging preview upload complete."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
