# pnpm reads build-script and other settings from here, not package.json's "pnpm" field.
# pnpm 11 removed onlyBuiltDependencies in favor of allowBuilds (a name -> allowed map).
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAge: 10080

overrides:
  undici: ^7.30.1
  # emdash 1.4.0 pins zod 4.5.4 (GHSA memory-exhaustion advisory, fixed in 4.6.6)
  zod: ^4.6.6
