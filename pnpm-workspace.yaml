# pnpm reads build-script and other settings from here, not package.json's "pnpm" field.
# pnpm 11 removed onlyBuiltDependencies in favor of allowBuilds (a name -> allowed map).
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAge: 10080

overrides:
  undici: ^7.29.0
  # vite 8.3.4's rolldown breaks the prerender worker on @astrojs/cloudflare 14.3.x's older workerd
  vite: 8.3.0
  # emdash pins pm 3.31.3; two copies split tiptap's types
  "@tiptap/pm": 3.31.4
