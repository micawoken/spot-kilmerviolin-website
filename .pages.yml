# Pages CMS config. The CMS is external (self-hosted on Vercel, or app.pagescms.org); it edits this repo
# over the GitHub API and none of its code runs in our worker. These entries must keep writing the same
# paths/formats the build-time readers expect (src/content.config.ts, src/lib/content/*) — see
# docs/dev/pages-cms.md and docs/dev/pages-cms-migration.md. A save is a commit, which triggers a rebuild
# that bakes content into the Worker bundle: the established "edit -> commit -> rebuild" publish flow.

# Where rich-text image uploads in page bodies are committed, and the public URL prefix they resolve to.
# Astro serves public/ at the site root, so public/uploads/<file> is reachable at /uploads/<file>.
media:
  input: public/uploads
  output: /uploads

content:
  # Public-facing pages -> src/content/pages/<slug>.mdoc, rendered by src/pages/[...slug].astro.
  # The route is keyed off the entry FILENAME (the catch-all slug), so the filename is the URL slug.
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    format: yaml-frontmatter
    # Dedicated slug model (chosen over title-drives-slug): the filename — and therefore the URL — comes
    # from the `slug` field, decoupled from the title, reproducing Keystatic's separate slug field. The
    # editor lists pages by title (view.primary) but the file is named from the slug.
    filename: '{fields.slug}.mdoc'
    subfolders: false
    view:
      primary: title
      fields: [title, pubDate]
      # `sort` lists the fields a user can sort by; `default` sets the initial sort (newest first).
      sort: [title, pubDate]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: The page title (also used in the browser tab and link previews).
      - name: slug
        label: Web address (slug)
        type: string
        required: true
        description: 'The last part of the URL, e.g. "about" serves the page at /about. Lowercase, no spaces.'
      - name: description
        label: Description
        type: text
        description: Short summary for search engines and link previews (~130–160 characters).
      - name: pubDate
        label: Last updated
        type: date
        options:
          # Must stay YYYY-MM-DD; src/content.config.ts coerces it to a Date (date-fns tokens).
          format: yyyy-MM-dd
      - name: body
        label: Content
        # `body` is the reserved field Pages CMS maps to the markdown body of the .mdoc file. rich-text
        # emits standard Markdown, which is valid Markdoc, so @astrojs/markdoc renders it unchanged.
        type: rich-text

  # Site title/description -> src/content/settings/site.json (read by src/lib/content/site.ts).
  - name: site_settings
    label: Site settings
    type: file
    path: src/content/settings/site.json
    format: json
    fields:
      - name: title
        label: Site title
        type: string
        description: Leave blank to use the built-in default (src/consts.ts).
      - name: description
        label: Site description
        type: text
        description: Leave blank to use the built-in default.

  # Header navigation -> src/content/settings/navigation.json (read by src/lib/content/nav.ts).
  - name: navigation
    label: Navigation
    type: file
    path: src/content/settings/navigation.json
    format: json
    fields:
      - name: links
        label: Header links
        type: object
        list: true # array of objects -> matches { links: [...] }
        fields:
          - name: label
            label: Label
            type: string
          - name: href
            label: Link
            type: string
            description: An on-site path like /about or a full URL.

  # Footer -> src/content/settings/footer.json (read by src/lib/content/footer.ts).
  - name: footer
    label: Footer
    type: file
    path: src/content/settings/footer.json
    format: json
    fields:
      - name: organization
        label: Organization
        type: string
      - name: tagline
        label: Tagline
        type: text
